[project]
name = "fototrip"
version = "0.1.0"
description = "Static website generator for geotagged trip photos"
readme = "README.md"
license = "MIT"
authors = [{ name = "Christian Lackas" }]
keywords = ["photography", "gps", "exif", "openstreetmap", "static-site"]
requires-python = ">=3.13"
dependencies = ["Pillow>=11", "timezonefinder>=6.5", "Jinja2>=3.1", "click>=8.1"]

[project.scripts]
fototrip = "fototrip.cli:main"

[project.optional-dependencies]
heic = ["pillow-heif>=0.18"]
album = ["osxphotos>=0.77"]
dev = ["pytest", "pytest-playwright", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
fototrip = ["templates/*.j2", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
